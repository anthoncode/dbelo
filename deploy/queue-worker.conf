; Supervisor: keeps the queue worker alive.
; Copy to /etc/supervisor/conf.d/dbelo-worker.conf
;
; This process runs ffmpeg and syncs the search index. If it dies, uploads
; sit in "Queued" forever and nobody notices until a contributor complains.

[program:dbelo-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/dbelo/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=600
directory=/var/www/dbelo
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
; Two workers: one long ffmpeg job must not block search indexing.
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/dbelo/storage/logs/worker.log
stopwaitsecs=700
