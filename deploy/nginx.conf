# nginx for dbelo. Copy to /etc/nginx/sites-available/dbelo and symlink.
# Run certbot afterwards to add the TLS block.

server {
    listen 80;
    server_name dbelo.com www.dbelo.com;
    return 301 https://dbelo.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.dbelo.com;
    return 301 https://dbelo.com$request_uri;
    # certbot fills in the certificate paths
}

server {
    listen 443 ssl http2;
    server_name dbelo.com;
    root /var/www/dbelo/public;

    index index.php;
    charset utf-8;

    # Audio uploads are large. Without this, a 120 MB WAV dies at the proxy
    # with a confusing 413 before PHP ever sees it.
    client_max_body_size 220M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Previews are immutable: named by UUID, never overwritten.
    location ~* ^/storage/sounds/previews/.*\.(mp3|ogg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(css|js|woff2|svg|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # ffmpeg is queued, but a big upload still takes a while to arrive.
        fastcgi_read_timeout 300;
    }

    # Never serve the master files, whatever the request looks like.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
